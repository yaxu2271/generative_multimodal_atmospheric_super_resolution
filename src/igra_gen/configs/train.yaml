defaults:
  - _self_
  - trainer: defaults
  - optimizer: adamw
  - experiment: era5_uncond
  - system: nersc

seed: 1234
resume: ""
dry_run: false

wandb:
  enabled: false  # Set to true to enable wandb logging
  project: "igra_gen"
  # name: "experiment_name"  # Optional: auto-generated if not provided
  # entity: "your_wandb_entity"  # Optional: your wandb username/entity
  # tags: ["tag1", "tag2"]  # Optional: list of tags
  # notes: "Experiment notes"  # Optional: description/notes
  mode: "online"  # "online", "offline", or "disabled"
  # group: "experiment_group"  # Optional: group runs together
  job_type: "train"

hydra:
  run:
    dir: results/${experiment_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: true