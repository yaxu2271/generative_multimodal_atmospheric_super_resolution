# @package _global_
defaults:
  - /data: era5_1.4_all
  - /model: ddpmpp
  - /loss: edm
  - /precond: edm

optimizer:
  lr: 0.00005

model:
  model_channels: 128
  channel_mult: [1, 2, 4, 6, 8]
  attn_resolutions: [[32, 64], [16, 32], [8, 16]]
  padding_mode: 'circular'

loss:
  P_mean: -1
  P_std: 1.5
  sigma_data: 1

data:
  batch_size: 16 #Local batch size
  data_workers: 4

trainer:
  total_kimg: 50000 # 50 mimg
  lr_rampup_kimg: 5000 # 5 mimg
  lr_min_factor: 0.05
  kimg_per_tick: 5
  checkpoint_ticks: 100 # every 100x5 kimg 
  conditional: True
  checkpoint_dir: ./checkpoints

experiment_name: era5_cond
